kind = "slides"
previewPath = "/minke-pitch-deck/"
title = "Minke Finance Pitch Deck"
version = "1.0.0"
id = "artifacts/minke-pitch-deck"
router = "path"

[[integratedSkills]]
name = "slides"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/minke-pitch-deck/" ]
localPort = 20222

[services.development]
run = "pnpm --filter @workspace/minke-pitch-deck run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/minke-pitch-deck", "run", "build" ]
publicDir = "artifacts/minke-pitch-deck/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20222"
BASE_PATH = "/minke-pitch-deck/"
