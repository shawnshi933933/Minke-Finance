kind = "web"
previewPath = "/minke-landing/"
title = "Minke Finance"
version = "1.0.0"
id = "artifacts/minke-landing"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/minke-landing/" ]
localPort = 24299

[services.development]
run = "pnpm --filter @workspace/minke-landing run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/minke-landing", "run", "build" ]
publicDir = "artifacts/minke-landing/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24299"
BASE_PATH = "/minke-landing/"
